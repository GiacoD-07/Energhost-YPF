<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Voltec Ergon">
  <!-- Logo Voltec Ergon: onda de corriente alterna. Mitad blanca = lo que se mide, mitad verde = lo que se ahorra. -->
  <circle cx="32" cy="32" r="30" fill="#0A2E6B"/>
  <path d="M10 32 C16 12, 26 12, 32 32" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
  <path d="M32 32 C38 52, 48 52, 54 32" fill="none" stroke="#0FB88A" stroke-width="5" stroke-linecap="round"/>
</svg>
